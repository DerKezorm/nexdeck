# Tests on every push and pull request; the Docker image on main and on tags.
#
# One run at a time: a tag and a push to main within the same minute would
# otherwise fetch the same layers twice and trip GitHub's rate limit. Running
# jobs are never cancelled; a half-published image is worse than a wait.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # The cheapest and strictest check first. The configuration lives in
      # backend/pyproject.toml; every exception there carries its reason.
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app tests

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      # Every pinned dependency against OSV, Python and npm in one run. No
      # account and no key.
      #
      # ⚠️ This can go red without anybody changing a line, because an advisory
      # is published elsewhere. That is the point: on 07.09.2026 pyzipper had
      # carried a known encryption bypass since May, the tool that finds it was
      # already in the repository, and nothing ever ran it. A build that turns
      # red the morning an advisory lands is the cheapest way to hear about it.
      - name: Dependencies against OSV
        working-directory: backend
        run: python tools/audit_deps.py

      # On a release the version in the code must match the tag, or the
      # about page and the update check would disagree with reality.
      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: backend
        run: |
          IN_CODE=$(python -c "import app; print(app.__version__)")
          ON_TAG="${GITHUB_REF_NAME#v}"
          echo "code: $IN_CODE / tag: $ON_TAG"
          if [ "$IN_CODE" != "$ON_TAG" ]; then
            echo "::error::app/__init__.py says $IN_CODE, the tag says $ON_TAG."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Zero warnings, and the number stays zero. See eslint.config.js.
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # The scale at the door: how much a visitor downloads on first open.
      # When it trips, the weight comes down; the limit does not go up.
      - name: First-load weight
        working-directory: frontend
        run: npm run weight

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Browser for the end-to-end test
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        working-directory: frontend
        env:
          NEXDECK_E2E_PYTHON: python
        run: npm run e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
