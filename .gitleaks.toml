# Second opinion next to the project's own scanner, which lives untracked in
# .git/hooks because its patterns name real people and a real network.
#
# Everything here is an allowlist. Nothing is switched off: a rule that fires
# on documentation twice on every push is a rule somebody stops reading, and
# then the one real finding goes past unnoticed.

[extend]
useDefault = true

[allowlist]
description = "Placeholders and test fixtures that are meant to be read."
paths = [
  '''package-lock\.json''',
  '''\.svg$''',
  '''\.png$''',
  '''\.ico$''',
  '''\.woff2$''',
]
regexes = [
  # The placeholder in the API documentation: nd_ is nexdeck's own token
  # prefix, and "your_token" is what a reader is meant to replace.
  '''nd_your_token''',
  # The reserved documentation domain, recommended by the own scanner's message.
  '''example\.(com|org|net)''',
  # Passwords the test suites use on themselves.
  '''another-long-password''',
  '''A-long-enough-password''',
  '''correct-horse-battery''',
  '''demo-password-123''',
  # The Elasticsearch API key the tests use: base64 for "test-key-for-the-cards".
  '''dGVzdC1rZXktZm9yLXRoZS1jYXJkcw==''',
  # Made-up secrets in log lines the masking tests feed to the assistant and the
  # diagnosis page; each test checks that the value is gone afterwards. The token
  # is jwt.io's own example.
  '''sk-abcdef123456''',
  '''9f8e7d6c5b4a''',
  '''ghp_abcdef123456''',
  '''abc123def456''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''',
  # Paths the Kodi test hands the picture proxy to see them refused: base64 for
  # "vfs:///etc/passwd" and "/etc/passwd". The word in them is what the rule saw.
  '''dmZzOi8vL2V0Yy9wYXNzd2Q''',
  '''L2V0Yy9wYXNzd2Q''',
  # Made-up keys of the custom card tests: each one stands for a connection's
  # secret, and the tests check that it never reaches a card, the demo data, a
  # submission or the AI.
  '''tok-0123456789''',
  '''0123456789abcdef''',
  '''key-of-the-sonarr-0001''',
  '''ghp_the-key-of-the-operator-0123456789''',
  '''apikeyzeta998877aabbccdd''',
  '''tok_Q9vX2mK7pL4wZ8rT''',
  '''9f86d081884c7d659a2feaa0''',
  '''k-0123456789''',
  '''Zk-Key-0123456789''',
  # Made-up keys under credential names in other spellings, which the demo data of a card must hide.
  '''k7Hq2pLw9Z0[a-c]''',
]
