nexdeck: integration
short: memos-cookie
name: Memos (cookie)
logo: memos
description: For older Memos (0.22 to 0.24), which hands the ticket out in a cookie. A pattern for any service that does.
category: other
fields:
  - name: username
    type: text
    label: User name
    required: true
  - name: password
    type: secret
    label: Password
    required: true
auth:
  type: session
  login: /api/v1/auth/signin
  send: json
  body: {username: "{username}", password: "{password}"}
  ticket: {from: cookie, name: memos.access-token}
  pass: {as: cookie}
test: /api/v1/auth/status
test_expects: json
reads:
  - path: /api/v1/memos?pageSize=10
    label: Latest notes
