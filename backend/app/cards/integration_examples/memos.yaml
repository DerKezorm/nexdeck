nexdeck: integration
short: memos
name: Memos
logo: memos
description: Notes you keep for yourself.
category: other
fields:
  - name: username
    type: text
    label: User name
    required: true
  - name: password
    type: secret
    label: Password
    required: true
auth:
  type: session
  login: /api/v1/auth/signin
  send: json
  body: {username: "{username}", password: "{password}"}
  ticket: {from: json, at: accessToken}
  pass: {as: header, header: Authorization, value: "Bearer {ticket}"}
test: /api/v1/auth/status
test_expects: json
reads:
  - path: /api/v1/memos?pageSize=10
    label: Latest notes
github: usememos/memos
