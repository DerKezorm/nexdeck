nexdeck: integration
short: memos-own
name: Memos
logo: memos
description: Notes you keep for yourself. An example of a sign-in with a session, for Memos 0.25 and later (nexdeck also has Memos built in).
category: other
fields:
  - name: username
    type: text
    label: User name
    required: true
  - name: password
    type: secret
    label: Password
    required: true
auth:
  type: session
  login: /api/v1/auth/signin
  send: json
  body:
    passwordCredentials: {username: "{username}", password: "{password}"}
  ticket: {from: json, at: accessToken}
  pass: {as: header, header: Authorization, value: "Bearer {ticket}"}
test: /api/v1/auth/me
test_expects: json
reads:
  - path: /api/v1/memos?pageSize=10
    label: Latest notes
check: /healthz
version: {path: /api/v1/instance/profile, at: version}
github: usememos/memos
