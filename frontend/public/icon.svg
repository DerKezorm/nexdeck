<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="nexdeck">
  <!-- Three stacked cards with a chart, on a white tile; dark when the system is dark.
       Same shape as components/Logo.tsx and tools/app-icons.mjs. -->
  <style>
    .ground { fill: #fff } .rim { stroke: #06b6d4; stroke-opacity: .35 } .chart { stroke: #0891b2 }
    .v1 { stop-color: #67e8f9 } .v2 { stop-color: #06b6d4 } .v3 { stop-color: #0e7490 }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0f1420 } .rim { stroke: #22d3ee; stroke-opacity: .45 } .chart { stroke: #67e8f9 }
      .v1 { stop-color: #cffafe } .v2 { stop-color: #22d3ee } .v3 { stop-color: #0891b2 }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/><stop offset=".5" class="v2"/><stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="ground" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rim" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
  <rect class="ground" x="24" y="12.5" width="28" height="19" rx="4.5" stroke="url(#g)" stroke-width="3.6" stroke-opacity=".45"/>
  <rect class="ground" x="18" y="20.5" width="28" height="19" rx="4.5" stroke="url(#g)" stroke-width="3.8" stroke-opacity=".75"/>
  <rect class="ground" x="12" y="29" width="28" height="20" rx="4.5" stroke="url(#g)" stroke-width="4.2"/>
  <path class="chart" d="M17.5 42.5l4.6-4.6 4 2.8 4.6-6 4 2.8" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
